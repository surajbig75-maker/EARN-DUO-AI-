<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Duo AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid #475569;
    }
    .header-card h1 {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .coin-display {
      font-size: 36px;
      font-weight: 700;
      color: #facc15;
    }
    .section-card {
      background-color: #1e293b;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #334155;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background-color: #2563eb;
      color: white;
    }
    .btn-primary:active {
      background-color: #1d4ed8;
    }
    .btn-success {
      background-color: #16a34a;
      color: white;
    }
    .btn-disabled {
      background-color: #475569 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .task-item:last-child {
      border-bottom: none;
    }
    .task-info p {
      font-size: 14px;
      font-weight: 500;
    }
    .task-info span {
      font-size: 12px;
      color: #facc15;
    }
    .task-btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      border: none;
      background-color: #0284c7;
      color: white;
      cursor: pointer;
    }
    .input-box {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: white;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .notice {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- कॉइन बैलेंस कार्ड -->
  <div class="header-card">
    <h1>कुल कॉइन बैलेंस</h1>
    <div class="coin-display" id="coinBalance">0</div>
    <div class="notice">न्यूनतम निकासी सीमा: 1000 कॉइन (₹10)</div>
  </div>

  <!-- डेली चेक-इन -->
  <div class="section-card">
    <div class="section-title">दैनिक बोनस</div>
    <button class="btn btn-primary" id="dailyCheckInBtn" onclick="claimDailyReward()">
      आज का रिवॉर्ड लें (+50 कॉइन)
    </button>
  </div>

  <!-- लकी स्पिनर -->
  <div class="section-card" style="text-align: center;">
    <div class="section-title">लकी स्पिन (हर 1 घंटे में)</div>
    <div id="spinResult" style="font-size: 18px; margin: 10px 0; font-weight: 600; color: #facc15;">
      स्पिन करने के लिए बटन दबाएँ
    </div>
    <button class="btn btn-primary" id="spinBtn" onclick="spinWheel()">स्पिन घुमाएँ</button>
  </div>

  <!-- टास्क ज़ोन -->
  <div class="section-card">
    <div class="section-title">दैनिक टास्क</div>
    <div class="task-item">
      <div class="task-info">
        <p>वेबसाइट विज़िट करें (30 सेकंड)</p>
        <span>+30 कॉइन</span>
      </div>
      <button class="task-btn" id="task1Btn" onclick="startTimerTask(1, 30, 30)">शुरू करें</button>
    </div>
    <div class="task-item">
      <div class="task-info">
        <p>आर्टिकल पढ़ें (60 सेकंड)</p>
        <span>+60 कॉइन</span>
      </div>
      <button class="task-btn" id="task2Btn" onclick="startTimerTask(2, 60, 60)">शुरू करें</button>
    </div>
  </div>

  <!-- विथड्रॉल सेक्शन -->
  <div class="section-card">
    <div class="section-title">कॉइन निकासी (UPI / Wallet)</div>
    <input type="text" id="upiId" class="input-box" placeholder="अपनी UPI ID दर्ज करें">
    <input type="number" id="withdrawCoins" class="input-box" placeholder="कॉइन की संख्या (उदा. 1000)">
    <button class="btn btn-success" onclick="processWithdraw()">निकासी अनुरोध भेजें</button>
    <div class="notice" id="withdrawStatus"></div>
  </div>
</div>

<script>
  let coins = parseInt(localStorage.getItem('user_coins')) || 0;
  let lastDailyClaim = localStorage.getItem('last_daily_claim');
  let lastSpinTime = localStorage.getItem('last_spin_time');

  function updateBalanceDisplay() {
    document.getElementById('coinBalance').innerText = coins;
    localStorage.setItem('user_coins', coins);
  }
  updateBalanceDisplay();

  // डेली चेक-इन
  function claimDailyReward() {
    const today = new Date().toDateString();
    if (lastDailyClaim === today) {
      alert("आप आज का रिवॉर्ड ले चुके हैं। कल दोबारा आएँ!");
      return;
    }
    coins += 50;
    localStorage.setItem('last_daily_claim', today);
    lastDailyClaim = today;
    updateBalanceDisplay();
    alert("बधाई हो! आपको 50 कॉइन मिल गए हैं।");
    checkDailyStatus();
  }

  function checkDailyStatus() {
    const today = new Date().toDateString();
    const btn = document.getElementById('dailyCheckInBtn');
    if (lastDailyClaim === today) {
      btn.innerText = "आज का रिवॉर्ड प्राप्त हुआ ✔";
      btn.classList.add('btn-disabled');
    }
  }
  checkDailyStatus();

  // स्पिन व्हील
  function spinWheel() {
    const now = Date.now();
    const oneHour = 60 * 60 * 1000;
    if (lastSpinTime && (now - lastSpinTime < oneHour)) {
      const remainingMinutes = Math.ceil((oneHour - (now - lastSpinTime)) / 60000);
      alert("कृपया " + remainingMinutes + " मिनट बाद दोबारा स्पिन करें।");
      return;
    }
    const rewards = [10, 20, 30, 50, 100];
    const win = rewards[Math.floor(Math.random() * rewards.length)];
    coins += win;
    localStorage.setItem('last_spin_time', now);
    lastSpinTime = now;
    document.getElementById('spinResult').innerText = "जीत: +" + win + " कॉइन!";
    updateBalanceDisplay();
  }

  // टाइमर टास्क
  function startTimerTask(taskId, seconds, rewardCoins) {
    const btn = document.getElementById('task' + taskId + 'Btn');
    btn.disabled = true;
    let remaining = seconds;
    btn.innerText = remaining + "s";

    const timer = setInterval(() => {
      remaining--;
      btn.innerText = remaining + "s";
      if (remaining <= 0) {
        clearInterval(timer);
        coins += rewardCoins;
        updateBalanceDisplay();
        btn.innerText = "पूरा हुआ ✔";
        btn.classList.add('btn-disabled');
      }
    }, 1000);
  }

  // निकासी
  function processWithdraw() {
    const upi = document.getElementById('upiId').value.trim();
    const reqCoins = parseInt(document.getElementById('withdrawCoins').value);
    const status = document.getElementById('withdrawStatus');

    if (!upi) {
      alert("कृपया सही UPI ID भरें!");
      return;
    }
    if (isNaN(reqCoins) || reqCoins < 1000) {
      alert("न्यूनतम निकासी 1000 कॉइन है!");
      return;
    }
    if (reqCoins > coins) {
      alert("आपके पास पर्याप्त कॉइन नहीं हैं!");
      return;
    }

    coins -= reqCoins;
    updateBalanceDisplay();
    status.innerText = "अनुरोध स्वीकार किया गया! 24 घंटे में भुगतान हो जाएगा।";
    status.style.color = "#4ade80";
  }
</script>

</body>
</html>
